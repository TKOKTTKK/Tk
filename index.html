<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API 聊天客户端</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f4f9; display: flex; flex-direction: column; height: 100vh; }
    header { background: #007aff; color: #fff; padding: 12px 16px; text-align: center; font-size: 16px; font-weight: bold; }
    .config-panel { background: #fff; padding: 10px 16px; border-bottom: 1px solid #ddd; font-size: 12px; }
    .config-group { display: flex; align-items: center; margin-bottom: 6px; }
    .config-group label { width: 70px; color: #666; font-weight: bold; }
    .config-group input, .config-group select { flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
    #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-break: break-word; }
    .user { align-self: flex-end; background: #007aff; color: #fff; border-bottom-right-radius: 2px; }
    .assistant { align-self: flex-start; background: #e5e5ea; color: #000; border-bottom-left-radius: 2px; white-space: pre-wrap; }
    .system-err { align-self: center; background: #ffe5e5; color: #d8000c; font-size: 12px; padding: 6px 12px; border-radius: 4px; }
    .input-area { display: flex; padding: 10px; background: #fff; border-top: 1px solid #ddd; }
    #user-input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; font-size: 14px; outline: none; }
    #send-btn { margin-left: 8px; padding: 0 16px; background: #007aff; color: #fff; border: none; border-radius: 20px; font-weight: bold; font-size: 14px; cursor: pointer; }
    #send-btn:disabled { background: #ccc; }
  </style>
</head>
<body>

  <header>AI 聊天面板</header>

  <div class="config-panel">
    <div class="config-group">
      <label>接口地址</label>
      <input type="text" id="api-url" value="https://lyozc.com/v1/chat/completions">
    </div>
    <div class="config-group">
      <label>API Key</label>
      <input type="password" id="api-key" value="sk-feb82e3b987f6a709f23798b38bd442b0ebf2050d1a72e87cf6d0c61d6ab5ed1">
    </div>
    <div class="config-group">
      <label>选择模型</label>
      <select id="api-model">
        <option value="claude-sonnet-5" selected>claude-sonnet-5</option>
        <option value="claude-opus-5">claude-opus-5</option>
        <option value="claude-opus-4-8">claude-opus-4-8</option>
        <option value="claude-sonnet-4-6">claude-sonnet-4-6</option>
      </select>
    </div>
  </div>

  <div id="chat-box">
    <div class="message assistant">你好！参数已为您自动配置完毕，随时可以开始聊天。</div>
  </div>

  <div class="input-area">
    <input type="text" id="user-input" placeholder="输入消息..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button id="send-btn" onclick="sendMessage()">发送</button>
  </div>

  <script>
    const messagesHistory = [];

    async function sendMessage() {
      const inputEl = document.getElementById('user-input');
      const sendBtn = document.getElementById('send-btn');
      const chatBox = document.getElementById('chat-box');

      const text = inputEl.value.trim();
      if (!text) return;

      const apiUrl = document.getElementById('api-url').value.trim();
      const apiKey = document.getElementById('api-key').value.trim();
      const model = document.getElementById('api-model').value;

      // 渲染用户消息
      appendMessage('user', text);
      messagesHistory.push({ role: 'user', content: text });
      inputEl.value = '';
      sendBtn.disabled = true;

      // 创建 AI 临时等待消息框
      const aiMsgDiv = appendMessage('assistant', '思考中...');

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: model,
            messages: messagesHistory
          })
        });

        const data = await response.json();

        if (response.ok && data.choices && data.choices.length > 0) {
          const reply = data.choices[0].message.content;
          aiMsgDiv.textContent = reply;
          messagesHistory.push({ role: 'assistant', content: reply });
        } else {
          const errText = data.error ? data.error.message : JSON.stringify(data);
          aiMsgDiv.className = 'message system-err';
          aiMsgDiv.textContent = '请求失败: ' + errText;
        }
      } catch (err) {
        aiMsgDiv.className = 'message system-err';
        aiMsgDiv.textContent = '网络错误/跨域拦截: ' + err.message;
      } finally {
        sendBtn.disabled = false;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    function appendMessage(role, text) {
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }
  </script>
</body>
</html>
